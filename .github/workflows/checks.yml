name: Code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_installation.py
      - run: python train.py --help
      - run: python test.py --help
      - run: python infer.py --help
      - run: python scripts/extract_depth_anything_v2.py --help
